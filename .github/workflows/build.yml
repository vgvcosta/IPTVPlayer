name: Build e testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar
        run: dotnet restore IPTVPlayer.sln

      - name: Compilar
        run: dotnet build IPTVPlayer.sln -c Release --no-restore

      - name: Testes
        run: dotnet test IPTVPlayer.sln -c Release --no-build --logger "console;verbosity=normal"
